services:
  - type: web
    name: tasmac-shop-11066-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set to Supabase PostgreSQL connection URI in Render Dashboard
      - key: CORS_ORIGINS
        value: "*"
      - key: SHOP_NUMBER
        value: "11066"
